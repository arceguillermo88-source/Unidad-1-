<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unidad 1 · Política Educativa Argentina</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6fafc;color:#203643;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1080px;margin:auto;padding:16px}.shell{background:white;border:1px solid #d7e5ec;border-radius:18px;overflow:hidden}header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;gap:12px;color:#005c69;font-size:12px;font-weight:750;letter-spacing:.08em}header span:last-child{text-align:right}.progress{height:4px;background:#e6f4f6}.progress div{height:100%;background:#34a9b7;transition:width .35s}nav{padding:12px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #d7e5ec}select{font:inherit;color:#005c69;border:1px solid #badce0;background:white;border-radius:8px;padding:9px;min-width:0;flex:1}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #0060a0;outline-offset:3px}.hero{background:linear-gradient(120deg,#005c69,#008090);color:white;padding:clamp(22px,5vw,42px);display:flex;align-items:center;gap:24px;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;right:-80px;bottom:-150px;width:240px;height:240px;border:30px solid #ffffff15;border-radius:50%;pointer-events:none}.hero div{flex:1;z-index:1}.hero small{letter-spacing:.12em;text-transform:uppercase;color:#cdeef0;font-weight:700}.hero h1{font-size:clamp(27px,4.5vw,46px);line-height:1.1;letter-spacing:-.035em;margin:9px 0 14px}.hero p{margin:0;color:#e6f4f6}.hero svg{width:100px;color:#d7f5f5;flex-shrink:0;animation:float 2.8s ease-in-out 1}@keyframes float{50%{transform:translateY(-8px)}}.content{padding:24px;min-height:235px;animation:enter .35s ease-out}@keyframes enter{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}.card{background:#e6f4f6;border:1px solid #cbe5e9;border-top:4px solid #008090;border-radius:12px;padding:18px}.card h2{font-size:19px;color:#005c69;margin:0 0 10px}.card p{margin:0}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:relative}.timeline button{border:1px solid #b8dce1;border-radius:10px;background:#e6f4f6;color:#005c69;padding:12px 8px;font-size:13px;font-weight:700;min-height:70px}.timeline button[aria-pressed=true]{background:#005c69;color:white;border-color:#005c69}.timeline button span{display:block;font-size:18px;margin-bottom:4px}.moment{margin-top:16px;border-left:4px solid #008090;padding:16px;background:#f6fafc;border-radius:8px;animation:enter .3s ease-out}.moment h2{margin:0 0 8px;color:#005c69;font-size:22px}.moment p{margin:0}.refs{display:grid;gap:9px}.refs article{border:1px solid #d7e5ec;border-radius:10px;padding:13px 16px}.refs p{margin:5px 0;font-size:14px}.refs a{color:#005c69;font-weight:650;font-size:14px}.note{font-size:13px;color:#526774;margin:15px 0 0}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #d7e5ec;padding:16px 24px}.footer button{border:1px solid #b8dce1;border-radius:8px;background:white;color:#005c69;padding:9px 14px;font-weight:650}.footer button:last-child{background:#005c69;color:white;border-color:#005c69}.footer button:disabled{opacity:.4;cursor:default}.dots{display:flex;gap:6px}.dots button{border:0;background:#c9dfe2;width:10px;height:10px;border-radius:50%;padding:0}.dots button[aria-current=step]{background:#008090;width:20px;border-radius:8px}@media(max-width:580px){main{padding:6px}header,nav,.content,.footer{padding:14px}.hero svg{width:52px}.timeline{grid-template-columns:repeat(2,1fr)}.footer{flex-wrap:wrap}.dots{order:3;width:100%;justify-content:center}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}.deeper{margin-top:16px;border:1px solid #b8dce1;border-radius:12px;background:#f6fafc}.deeper summary{padding:15px 18px;cursor:pointer;color:#005c69;font-weight:750}.deepbody{padding:0 18px 16px;display:grid;gap:12px}.deepbody article{padding:12px 0;border-top:1px solid #d7e5ec}.deepbody h3{margin:0 0 6px;color:#005c69;font-size:18px}.deepbody p{margin:0 0 6px}.deepbody small{color:#526774}</style></head><body><main><article class="shell"><header><span>UTN AVELLANEDA · TRAMO PEDAGÓGICO</span><span>POLÍTICA EDUCATIVA ARGENTINA · UNIDAD 1</span></header><div class="progress" role="progressbar" aria-label="Posición en el recorrido" aria-valuemin="1" aria-valuemax="7" aria-valuenow="1"><div id="bar"></div></div><nav><select id="jump" aria-label="Elegir pantalla"></select><span id="count"></span></nav><section class="hero" id="hero"></section><section class="content" id="content"></section><footer class="footer"><button id="prev">← Anterior</button><div class="dots" id="dots" aria-label="Navegación por pantallas"></div><button id="next">Siguiente →</button></footer></article></main><script>
const slides=[["01 · Punto de partida", "El Estado y la educación", "¿Cómo se relacionan las instituciones estatales, las políticas públicas y el derecho a la educación?", "landmark", [["El recorrido", "Exploraremos el concepto de Estado, sus transformaciones históricas y su intervención en el sistema educativo."], ["Propósito", "Reconocer el carácter social y político de las decisiones educativas."]]], ["02 · Concepto", "¿Qué entendemos por Estado?", "Un concepto jurídico-político.", "landmark", [["Instituciones", "Conjunto de instituciones que gobiernan, aplican leyes y ejercen soberanía sobre la población de un territorio determinado."], ["Una construcción social", "El Estado no es una totalidad homogénea ni una entidad aislada: expresa conflictos, diferencias e intereses presentes en la sociedad."], ["Políticas estatales", "Deben entenderse como posicionamientos dentro de procesos sociales más amplios."]]], ["03 · Historia", "Transformaciones históricas", "Seleccioná un momento de la línea de tiempo para explorar sus características.", "clock", []], ["04 · Derechos", "El Estado como garante de derechos", "La educación es un derecho inalienable.", "scale", [["Garantía de derechos", "Como organización jurídica de la ciudadanía, el Estado debe garantizar los derechos de todos los sujetos y promover políticas públicas integrales orientadas al bien común."], ["Educación como derecho", "El Estado es el principal responsable de garantizar acceso, permanencia y egreso de toda la población al sistema educativo, con criterios de justicia e inclusión."]]], ["05 · Políticas públicas", "Del Estado al aula", "Las políticas educativas se concretan mediante instituciones y actores.", "book", [["Políticas curriculares", "Mediante diseños y propuestas curriculares, el Estado interviene en la política educativa provincial y fortalece políticas públicas universales frente a acciones focalizadas características de la década de 1990."], ["Rol de los actores educativos", "Docentes, equipos directivos y supervisores/as, como agentes del Estado, participan activamente en la implementación de políticas curriculares en cada distrito, escuela y aula."]]], ["06 · Síntesis", "Horizonte de las políticas educativas", "Construir una realidad deseada mediante procesos participativos.", "target", [["Democracia y derechos", "Las políticas educativas buscan fortalecer la democracia, lo común, lo colectivo y el ejercicio pleno de derechos."], ["Para reflexionar", "¿De qué manera las decisiones del Estado se hacen visibles en las prácticas de una institución educativa?"]]], ["07 · Lecturas", "Referencias bibliográficas", "Consultá los materiales para profundizar los conceptos.", "book", []]],timeline=[["Segunda mitad del siglo XX", "Crisis del Estado de Bienestar en la segunda mitad del siglo XX. El material propone observar cómo los cambios en la intervención estatal modifican las prioridades de las políticas públicas, incluida la educación."], ["Orden autoritario", "Configuración de un orden estatal autoritario y terrorismo de Estado, con políticas represivas que también afectaron al sistema educativo."], ["1973 y 1983", "Los retornos a gobiernos democráticos en 1973 y 1983 abrieron posibilidades de participación popular. Entre ambos se produjo la dictadura de 1976–1983; por eso estos procesos no constituyen una continuidad democrática."], ["Años 90", "El Estado redujo su intervención en áreas públicas, mientras fortaleció a sectores empresariales y capitales extranjeros. El material caracteriza este período mediante la tensión entre políticas universales y acciones focalizadas."], ["Siglo XXI", "El material propone repensar el Estado desde la redistribución, la inclusión y la profundización democrática. En educación, esta perspectiva invita a considerar las condiciones necesarias para garantizar el derecho a aprender."]],refs=[["Puiggrós, Adriana (2003).", "Qué pasó en la educación: breve historia desde la conquista hasta el presente. Capítulo 4, “La organización del sistema educativo nacional”. Buenos Aires, Galerna, pp. 73–90.", "https://irp.cdn-website.com/7b1aec33/files/uploaded/Adriana%20Puiggros.%20Qu%C3%A9%20pas%C3%B3%20en%20la%20educaci%C3%B3n%20argentina.%20Breve%20historia%20de%20la%20educaci%C3%B3n%20argentina..pdf"], ["Puiggrós, Adriana (1990).", "Historia de la educación en la Argentina. Tomo I: Sujetos, Disciplina y Curriculum en los orígenes del sistema educativo argentino. Capítulo 4. Buenos Aires, Galerna.", ""], ["Constitución Nacional de 1853.", "Última consulta consignada: marzo de 2020.", "http://www.biblioteca.jus.gov.ar/constitucionargentina1853.html"], ["Ley de Educación común N.º 1.420 de 1884.", "", "http://www.bnm.me.gov.ar/giga1/normas/5421.pdf"], ["Ley Nacional 4874/1905.", "Última consulta consignada: marzo de 2020.", "http://www.bnm.me.gov.ar/giga1/documentos/EL000881.pdf"], ["Ley Nacional 8871/1912.", "Última consulta consignada: marzo de 2020.", "https://www.argentina.gob.ar/normativa/nacional/ley-8871-310143"]];const icons={landmark:'M4 11L24 3l20 8zM7 15h34M10 15v20m9-20v20m10-20v20m9-20v20M5 35h38M3 41h42',clock:'M24 5a19 19 0 1 0 0 38 19 19 0 1 0 0-38zM24 12v13l9 5',scale:'M24 5v36M14 41h20M5 13h38M11 13L4 29h14zM37 13l-7 16h14z',book:'M4 8h13q7 0 7 6v28q-4-5-10-5H4zM44 8H31q-7 0-7 6v28q4-5 10-5h10zM9 17h8m-8 7h8m14-7h8m-8 7h8',target:'M24 5a19 19 0 1 0 19 19M24 13a11 11 0 1 0 11 11M24 24L43 5m-9 0h9v9'};let page=0,moment=0;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s[0];$('jump').append(o);const b=document.createElement('button');b.setAttribute('aria-label','Ir a pantalla '+(i+1));b.onclick=()=>show(i);$('dots').append(b)});const deeper={"0": [["Una mirada histórica", "La organización escolar argentina no surgió de una sola decisión. Fue el resultado de debates sobre quién debía educar, cómo financiar la enseñanza y qué lugar ocuparían las provincias, la Nación y la sociedad civil.", "Puiggrós (2003), cap. 4."]], "1": [["Estado, Nación y gobierno", "El Estado comprende instituciones relativamente permanentes; el gobierno conduce esas instituciones durante un período. Distinguirlos permite comprender por qué una política educativa puede cambiar sin que desaparezca el sistema escolar.", "Ampliación conceptual didáctica."], ["El federalismo educativo", "La Constitución de 1853 estableció la responsabilidad provincial por la educación primaria (art. 5) y reconoció la libertad de enseñar y aprender (art. 14). Así, las responsabilidades educativas no se concentran en una sola jurisdicción.", "Constitución Nacional, arts. 5 y 14."]], "2": [["1853 · Constitución Nacional", "La organización federal y la libertad de enseñar y aprender sentaron bases jurídicas para el desarrollo educativo.", "Constitución Nacional, arts. 5 y 14."], ["1884 · Ley 1420", "Organizó la educación primaria común, gratuita y obligatoria en la Capital y los territorios nacionales. El debate sobre la enseñanza religiosa y el gobierno escolar muestra que la expansión de la escuela también implicaba disputas políticas.", "Puiggrós (2003), cap. 4; Ley 1420."], ["1905 · Ley Láinez", "Permitió que el Consejo Nacional de Educación estableciera escuelas en las provincias que lo solicitaran, especialmente rurales. La ampliación de la escolarización convivió con tensiones entre autonomía provincial y acción nacional.", "Ley 4874, art. 1; Biblioteca Nacional de Maestros."], ["1912 · Ley Sáenz Peña", "Estableció el voto secreto y obligatorio para los ciudadanos varones habilitados. No era una ley educativa: su relación con la unidad es la ampliación histórica de la participación política, todavía con exclusiones.", "Ley 8871; interpretación didáctica."]], "3": [["Del reconocimiento al ejercicio del derecho", "Reconocer un derecho no garantiza por sí solo que todos puedan ejercerlo. El acceso requiere instituciones disponibles; la permanencia exige condiciones de enseñanza y acompañamiento; el egreso supone oportunidades efectivas de completar las trayectorias.", "Ampliación del material de estudio."]], "4": [["Currículum y decisiones públicas", "Elegir qué saberes enseñar, cómo organizarlos y qué objetivos orientar no es una tarea neutral. Los diseños curriculares expresan prioridades públicas y se concretan mediante decisiones pedagógicas situadas.", "Ampliación del material de estudio."], ["Un ejemplo institucional", "Un equipo docente que adapta estrategias de enseñanza para sostener trayectorias diversas traduce una orientación pública en decisiones concretas. No se limita a ejecutar una norma: interpreta sus propósitos en un contexto.", "Ejemplo didáctico."]], "5": [["Una tensión histórica que permanece", "La expansión escolar puede ampliar derechos y, a la vez, imponer criterios uniformes de organización. Los debates fundacionales permiten preguntar cómo combinar una educación común con la diversidad de experiencias y necesidades.", "Puiggrós (2003), cap. 4; reflexión didáctica."]]}; function enrichment(i){return deeper[i]?`<details class="deeper"><summary>${i===2?"Explorar los antecedentes históricos: 1853–1912":"Ampliar y profundizar"}</summary><div class="deepbody">${deeper[i].map(x=>`<article><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p><small>${esc(x[2])}</small></article>`).join("")}</div></details>`:"";} function renderMoment(){document.querySelectorAll('.timeline button').forEach((b,i)=>b.setAttribute('aria-pressed',i===moment));$('moment').innerHTML='<h2>'+esc(timeline[moment][0])+'</h2><p>'+esc(timeline[moment][1])+'</p>'}function show(i){page=i;let s=slides[i];$('hero').innerHTML='<div><small>'+esc(s[0])+'</small><h1>'+esc(s[1])+'</h1><p>'+esc(s[2])+'</p></div><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="'+icons[s[3]]+'"/></svg>';$('content').innerHTML='';if(i===2){$('content').innerHTML='<div class="timeline">'+timeline.map((t,j)=>'<button aria-pressed="false"><span>0'+(j+1)+'</span>'+esc(t[0])+'</button>').join('')+'</div><div class="moment" id="moment" aria-live="polite"></div>';document.querySelectorAll('.timeline button').forEach((b,j)=>b.onclick=()=>{moment=j;renderMoment()});renderMoment()}else if(i===6){$('content').innerHTML='<div class="refs">'+refs.map(r=>'<article><strong>'+esc(r[0])+'</strong><p>'+esc(r[1])+'</p>'+(r[2]?'<a href="'+esc(r[2])+'" target="_blank" rel="noopener noreferrer">Consultar referencia ↗</a>':'')+'</article>').join('')+'</div><p class="note"><a href="https://bnm.educacion.gob.ar/nuevas-fuentes-digitalizadas-en-el-espacio-medar-legislacion-escolar-provincial/" target="_blank" rel="noopener noreferrer">Biblioteca Nacional de Maestros: legislación escolar provincial</a> · <a href="https://www.argentina.gob.ar/normativa/nacional/ley-24430-804/texto" target="_blank" rel="noopener noreferrer">Constitución (texto con reformas)</a></p><p class="note">Referencias originales del material de estudio. La ampliación utiliza el capítulo de Puiggrós (2003), la Constitución y la normativa histórica. La obra de 1990 se conserva como lectura recomendada; no se verificó íntegramente su capítulo 4. Los ejemplos y ampliaciones conceptuales se identifican como aportes didácticos.</p>'}else{$('content').innerHTML='<div class="cards">'+s[4].map(c=>'<article class="card"><h2>'+esc(c[0])+'</h2><p>'+esc(c[1])+'</p></article>').join('')+'</div>'}$('content').insertAdjacentHTML('beforeend',enrichment(i));$('count').textContent=(i+1)+' / '+slides.length;$('jump').value=i;$('bar').style.width=((i+1)/slides.length*100)+'%';document.querySelector('.progress').setAttribute('aria-valuenow',i+1);[...$('dots').children].forEach((b,j)=>b.setAttribute('aria-current',i===j?'step':'false'));$('prev').disabled=i===0;$('next').textContent=i===slides.length-1?'Volver al inicio ↺':'Siguiente →';} $('jump').onchange=e=>show(+e.target.value);$('prev').onclick=()=>show(Math.max(0,page-1));$('next').onclick=()=>show((page+1)%slides.length);show(0);
</script></body></html>
